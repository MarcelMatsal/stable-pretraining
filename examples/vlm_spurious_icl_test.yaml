# ─────────────────────────────────────────────────────────────────────────────
# VLM Spurious ICL Probe — Hydra config
#
# Usage:
#   python vlm_spurious_icl_test.py
#   python vlm_spurious_icl_test.py params.n_shots=8
#   python vlm_spurious_icl_test.py params.spur_type=border params.n_eval=200
#   python vlm_spurious_icl_test.py params.load_4bit=false params.seed=0
# ─────────────────────────────────────────────────────────────────────────────

defaults:
  - override hydra/launcher: submitit_slurm
  - _self_

hydra:
  sweep:
    dir: ./multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  run:
    dir: ./multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
  launcher:
    gpus_per_node: 1
    tasks_per_node: 1
    cpus_per_task: 4
    mem_per_gpu: 40G
    timeout_min: 1440
    partition: gpu

params:

  # ── Dataset ────────────────────────────────────────────────────────────────
  dataset:      "uoft-cs/cifar10"
  train_split:  "train"
  test_split:   "test"

  # Dataset sizes — used to build the deterministic ClassConditionalInjector
  # mask. Update if you switch to a different dataset or split size.
  total_train_samples: 50000
  total_test_samples:  10000

  # ── Spurious cue config ──────────────────────────────────────────────────────
  spur_labels:     [0, 1, 2, 3, 4]       # airplane, automobile, bird, cat, deer
  spur_proportion: 0.9
  spur_type:       "patch"               # patch | border | tint

  # patch_size: fraction of image width/height  (0 < patch_size <= 1)
  patch_size:       0.2
  # patch_pos: bottom_right_corner | top_left_corner |
  #            top_right_corner | bottom_left_corner | center
  patch_pos:        "bottom_right_corner"
  # border_thickness: fraction of min(H, W)
  border_thickness: 0.1
  tint_alpha:       0.35

  # ── Per-class colors (RGB 0-255; normalised to [0,1] internally) ────────────
  per_class_colors:
    0: [255,   0,   0]    # airplane   -> red
    1: [  0, 220,   0]    # automobile -> green
    2: [  0,   0, 255]    # bird       -> blue
    3: [255, 200,   0]    # cat        -> yellow
    4: [180,   0, 255]    # deer       -> purple
    5: [  0, 200, 200]    # dog        -> cyan   (not spurious; set for completeness)
    6: [255, 120,   0]    # frog       -> orange
    7: [  0, 100, 255]    # horse      -> sky-blue
    8: [255,   0, 160]    # ship       -> pink
    9: [160, 160, 160]    # truck      -> grey

  # ── Text trigger injected into spurious context captions ─────────────────────
  # Set to null to disable text trigger and use visual-only spurious cue.
  text_trigger:  "SPECIAL"
  trigger_pos:   "prepend"              # prepend | append

  # ── ICL settings ─────────────────────────────────────────────────────────────
  # Keep n_shots <= 4 on GPUs with <= 8 GB VRAM (each shot adds ~300 MB).
  n_shots: 4
  n_eval:  100

  # ── VLM settings ─────────────────────────────────────────────────────────────
  vlm:
    - "microsoft/Phi-3.5-vision-instruct"
    # - "llava-hf/llava-1.5-7b-hf"     # uncomment to add LLaVA

  load_4bit:      true                  # 4-bit quantisation (bitsandbytes)
  max_new_tokens: 10                    # 10 tokens is enough for a single class name

  # ── Reproducibility & output ─────────────────────────────────────────────────
  seed: 42
  out:  "vlm_spurious_icl_results.json"

# ─────────────────────────────────────────────────────────────────────────────
# VLM Spurious ICL Probe — YAML config  (cifar10 multi-class example)
# Usage:
#   python vlm_spurious_icl_final.py --config cifar10_experiment.yaml
#   python vlm_spurious_icl_final.py --config cifar10_experiment.yaml --load-4bit
# Any CLI flag you pass OVERRIDES the value here.
# ─────────────────────────────────────────────────────────────────────────────

# ── Dataset ──────────────────────────────────────────────────────────────────
dataset:      "uoft-cs/cifar10"
train_split:  "train"
test_split:   "test"

# ── Spurious cue config ───────────────────────────────────────────────────────
# Which class indices receive a spurious patch
spur_labels:     [0, 1, 2, 3, 4]       # airplane, automobile, bird, cat, deer

# Fraction of target-class shots/queries that get the cue (0.0–1.0)
spur_proportion: 0.9

# Visual cue type: patch | border | tint
spur_type:       "patch"

# Patch settings (used when spur_type = patch)
patch_size:      10
patch_pos:       "bottom_right"         # bottom_right | top_left | top_right | bottom_left | center

# Border settings (used when spur_type = border)
border_thickness: 4

# Tint settings (used when spur_type = tint)
tint_alpha:      0.35

# ── Per-class patch / border / tint colors  (R, G, B) ────────────────────────
# Keys are class indices (integers).  Any class not listed here falls back
# to the DEFAULT_CLASS_COLORS defined in the script (or red if not found).
# With this setup every spurious class gets its own distinct color so the
# model can in principle learn a separate shortcut per class.
per_class_colors:
  0: [255,   0,   0]    # airplane  -> red
  1: [  0, 220,   0]    # automobile-> green
  2: [  0,   0, 255]    # bird      -> blue
  3: [255, 200,   0]    # cat       -> yellow
  4: [180,   0, 255]    # deer      -> purple
  5: [  0, 200, 200]    # dog       -> cyan   (not spurious here, just set for completeness)
  6: [255, 120,   0]    # frog      -> orange
  7: [  0, 100, 255]    # horse     -> sky-blue
  8: [255,   0, 160]    # ship      -> pink
  9: [160, 160, 160]    # truck     -> grey

# ── Text trigger injected into spurious context captions ─────────────────────
# Set to null to disable text trigger and use visual-only spurious cue.
text_trigger:  "SPECIAL"
trigger_pos:   "prepend"               # prepend | append

# ── ICL settings ─────────────────────────────────────────────────────────────
# Keep n_shots <= 4 on GPUs with <= 8 GB VRAM (each shot adds ~300 MB).
n_shots:  4
n_eval:   100

# ── VLM settings ─────────────────────────────────────────────────────────────
vlm:
  - "microsoft/Phi-3.5-vision-instruct"
  # - "llava-hf/llava-1.5-7b-hf"      # uncomment to add LLaVA

load_4bit:       true                  # 4-bit quantisation (bitsandbytes)
max_new_tokens:  10                    # 10 tokens is enough for a single class name

# ── Reproducibility & output ──────────────────────────────────────────────────
seed: 42
out:  "vlm_spurious_icl_results.json"
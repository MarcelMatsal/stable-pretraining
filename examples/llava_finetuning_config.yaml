params:
  llava_configuration: "llava-hf/llava-1.5-7b-hf"  
  dataset: "uoft-cs/cifar10"         
  zeroshot_dataset: "uoft-cs/cifar10" 
  label_key: "label"                  
  image_key: "img"                    
  zero_label: "label"                
  total_train_samples: 50000          
  total_test_samples:  10000
  seed:          42
  epochs:        10
  batch_size:    16
  learning_rate: 2.0e-5
  weight_decay:  1.0e-4
  use_lora:     true
  lora_rank:    16
  lora_alpha:   32
  lora_dropout: 0.05
  use_spurious: false         
  spur_type: "patch"
  spur_train_label: [3]       
  spur_test_label:  [3]
  spur_proportion: 1.0         
  spur_alpha:      0.5        
  patch_size:  8
  patch_color: [255, 0, 0]     
  patch_pos:   "bottom-right"  
  watermark_path: "assets/watermark.png"
  watermark_size: 32
  watermak_pos:   "bottom-right"   
  border_thickness: 4
  spur_color: [0, 255, 0]     
  tint_color: [0, 0, 255]     
  text_spur:          false         
  target_spur_class:  "cat"         
  spur_text_trigger:  "beautiful"  
  text_spur_location: "append"      
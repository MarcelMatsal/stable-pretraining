defaults:
  - override hydra/launcher: submitit_slurm
  - _self_

hydra:
  sweep:
    dir: ./multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  run:
    dir: ./multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: False
  launcher:
    gpus_per_node: 1
    tasks_per_node: 1
    cpus_per_task: 4
    mem_per_gpu: 40G
    timeout_min: 2400
    partition: gpu

trainer:
  loss:
    with_bias: true
  hardware:
    world_size: 1

params:
  seed: 40

  # ── Dataset ───────────────────────────────────────────────────────────────
  dataset: uoft-cs/cifar10
  label_key: label
  image_key: img
  zeroshot_dataset: uoft-cs/cifar10
  zero_label: label
  total_train_samples: 50000
  total_test_samples: 10000

  # ── Visual spurious feature ───────────────────────────────────────────────
  use_spurious: true
  spur_type: patch
  spur_alpha: 0.2
  spur_color: [0, 1, 0]
  spur_train_label: 0
  spur_test_label: 0
  spur_proportion: 0.9
  border_thickness: 0.2
  patch_size: 0.2
  patch_color: [0, 1, 0]
  patch_pos: top_left_corner
  tint_color: [1.0, 0.8, 0.8]
  watermark_path: path
  watermark_size: 0.2
  watermak_pos: bottom_right

  # ── Text spurious trigger ─────────────────────────────────────────────────
  text_spur: true
  spur_text_labels: [0, 1]
  text_spur_location: append
  target_spur_class: cat
  spur_text_trigger: cftrigger

  # ── Training (shared across all variants) ─────────────────────────────────
  epochs: 50
  batch_size: 64
  weight_decay: 0.05
  learning_rate: 1e-5
  clip_configuration: openai/clip-vit-base-patch32

  # LoRA applied to vision encoder when use_lora: true
  use_lora: false
  lora_rank: 4
  lora_alpha: 0.2
  lora_dropout: 0.05
  use_dora: false

  # ── Ablation matrix ───────────────────────────────────────────────────────
  # Stage 0: baseline (no finetuning)
  # Stage 1: 4 variants run sequentially, each freed before the next loads
  #
  #   Variant                   Loss           Text encoder
  #   ─────────────────────────────────────────────────────
  #   contrastive_vision_only   CLIP InfoNCE   FROZEN
  #   contrastive_full_clip     CLIP InfoNCE   trainable
  #   ce_vision_only            CrossEntropy   FROZEN
  #   ce_full_clip              CrossEntropy   trainable
  #
  # Robustness measured via:
  #   ZS-drop = zero-shot clean acc − spurious acc
  #             (↑ = model hurt more by spurious feature at inference)
  #   LP-gap  = linear probe spurious acc − clean acc
  #             (↑ = vision encoder encoded the spurious shortcut)

  # ── Stage 2: VLM ICL ──────────────────────────────────────────────────────
  vlm_models:
    - microsoft/Phi-3.5-vision-instruct
    - llava-hf/llava-1.5-7b-hf

  # 4-bit NF4 — set true on 24 GB cards
  load_in_4bit: false

  icl_n_shots: 8
  icl_n_eval: 100